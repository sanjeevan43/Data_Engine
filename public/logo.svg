<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="200" height="200" rx="40" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Data flow icon - stylized database with flow arrows -->
  <g transform="translate(100, 100)">
    <!-- Database cylinder top -->
    <ellipse cx="0" cy="-35" rx="35" ry="12" fill="url(#iconGradient)" opacity="0.9"/>
    
    <!-- Database cylinder body -->
    <rect x="-35" y="-35" width="70" height="50" fill="url(#iconGradient)" opacity="0.8"/>
    
    <!-- Database cylinder bottom -->
    <ellipse cx="0" cy="15" rx="35" ry="12" fill="url(#iconGradient)" opacity="0.9"/>
    
    <!-- Flow arrows -->
    <g transform="translate(-55, -10)">
      <!-- Left arrow pointing in -->
      <path d="M -15 0 L -5 0 L -5 -5 L 5 0 L -5 5 L -5 0 Z" fill="#FCD34D" opacity="0.9"/>
    </g>
    
    <g transform="translate(55, -10)">
      <!-- Right arrow pointing out -->
      <path d="M 15 0 L 5 0 L 5 -5 L -5 0 L 5 5 L 5 0 Z" fill="#FCD34D" opacity="0.9"/>
    </g>
    
    <!-- Data lines inside database -->
    <line x1="-20" y1="-25" x2="20" y2="-25" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="-20" y1="-15" x2="20" y2="-15" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="-20" y1="-5" x2="20" y2="-5" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="-20" y1="5" x2="20" y2="5" stroke="white" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Sparkle effect -->
  <circle cx="160" cy="40" r="4" fill="#FCD34D" opacity="0.8"/>
  <circle cx="170" cy="50" r="3" fill="#FCD34D" opacity="0.6"/>
  <circle cx="40" cy="160" r="3" fill="#FCD34D" opacity="0.7"/>
</svg>
